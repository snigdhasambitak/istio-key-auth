# One Secret per client. Every entry named api-key or api-key-<suffix> is a valid key for the client, so a key can
# be rotated without downtime: add api-key-next, move the client over, then remove the old api-key.
apiVersion: v1
kind: Secret
metadata:
  name: mobile-app
  namespace: istio-key-auth
  labels:
    istio-key-auth.io/api-key: "true"
  annotations:
    istio-key-auth.io/client: mobile-app
    # Optional limits, comma separated. Leave one out to allow every host, path or method.
    istio-key-auth.io/hosts: orders.example.com
    istio-key-auth.io/path-prefixes: /v1/orders
    istio-key-auth.io/methods: GET, HEAD
    # Optional: passed upstream in x-api-client-groups, and the key stops working at expires-at (RFC 3339).
    istio-key-auth.io/groups: read-only, partners
    istio-key-auth.io/expires-at: "2027-12-31T23:59:59Z"
type: Opaque
stringData:
  api-key: replace-with-a-long-random-value
  api-key-next: replace-with-the-next-long-random-value
