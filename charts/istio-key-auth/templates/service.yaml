apiVersion: v1
kind: Service
metadata:
  name: {{ include "ika.name" . }}
  labels: {{- include "ika.labels" . | nindent 4 }}
spec:
  selector: {{- include "ika.selector" . | nindent 4 }}
  ports:
    - name: grpc
      port: 9001
      targetPort: grpc
      appProtocol: grpc
    - name: http
      port: 8000
      targetPort: http
    - name: http-metrics
      port: 9090
      targetPort: ops
